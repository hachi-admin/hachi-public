name: Design lint

# The design system is a set of mechanical properties — paired shadows, depth range, no colour
# edges, a softness floor, spacing that clears the blur. Those should fail here, not on someone's
# phone. Judgement calls (is this card carrying too much?) are not in scope; hachi-core's
# design_audit task handles those.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The asset-version check diffs against the base branch; a shallow clone has no base to
          # diff against and the check would pass by finding nothing — which is worse than absent.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run design lint
        run: node scripts/design-lint.js

      # A dashboard change that ships without a new ?v= is invisible to anyone with a warm cache.
      - name: Asset version bumped
        run: node scripts/check-asset-version.js origin/${{ github.base_ref || 'main' }}
