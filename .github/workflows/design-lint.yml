name: Design lint

# The design system is a set of mechanical properties — paired shadows, depth range, no colour
# edges, a softness floor, spacing that clears the blur. Those should fail here, not on someone's
# phone. Judgement calls (is this card carrying too much?) are not in scope; hachi-core's
# design_audit task handles those.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The asset-version check diffs against the base branch; a shallow clone has no base to
          # diff against and the check would pass by finding nothing — which is worse than absent.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run design lint
        run: node scripts/design-lint.js

      # A dashboard change that ships without a new ?v= is invisible to anyone with a warm cache.
      - name: Asset version bumped
        run: node scripts/check-asset-version.js origin/${{ github.base_ref || 'main' }}

      # `CHANNELS is not defined` took down the whole channels page in production. node --check
      # cannot see it — an undefined identifier is a scope question, not a syntax one, and it
      # throws only when that line runs. hachi-core has had this rule since it caught four of the
      # same class in a single pass; the dashboard not having it is the only reason this shipped.
      - name: Install lint deps
        run: npm ci || npm install --no-audit --no-fund
      - name: ESLint (no-undef)
        run: npm run lint

      # no-undef proves the names resolve. It cannot prove the function survives the shapes the
      # data actually takes — empty lists, failed tasks, a source whose url does not parse. This
      # runs the render functions against those cases.
      - name: Render smoke test
        run: npm run smoke
